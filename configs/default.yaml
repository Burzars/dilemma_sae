# =====================================================================
# Конфигурация по умолчанию для пайплайна dilemma_sae.
#
# Все скрипты в scripts/ принимают:
#   --config configs/default.yaml
#   --override <dotted.key>=<value>      # можно повторять несколько раз
#
# Пример переопределения:
#   python scripts/02_train_sae.py \
#       --config configs/default.yaml \
#       --override sae.mode=topk sae.k=16
# =====================================================================

model:
  # КРИТИЧНО: эта модель (локальный extract) ДОЛЖНА совпадать с генератором
  # текстов в src/generate_answers.py (GEN_MODEL=qwen/qwen-2.5-7b-instruct) —
  # одна версия, один chat-template, иначе тексты и активации рассогласуются.
  name: "Qwen/Qwen2.5-7B-Instruct"
  dtype: "bfloat16"
  device_map: "auto"

data:
  # v2-корпус: SAE учим на full-срезе (см. src/build_datasets.py).
  # Контраст/триггеры считаем на balanced-срезе (data.results_dir переопределяют
  # под нужный срез через --override на шаге анализа).
  results_dir: "data/results_dilemma_v2_full"   # файлы volunteer_data_llama_reasoning_*_res.json

extraction:
  layer_idx: -5          # средне-глубокий слой (фиксирован; sweep по слоям не делаем)
  max_length: 1024
  stride: 16             # шаг по позициям токенов внутри ответа ассистента
  min_position: 8        # пропускаем первые N токенов (системный шаблон)
  batch_size: 4          # рассчитано на T4 16 ГБ; на A100/H100 можно поднять
  only_assistant_positions: true

sae:
  # mode: relu_l1 | topk | jumprelu
  mode: "topk"
  expansion: 16          # d_hidden = d_in * expansion (для 3B → ~32k нейронов)
  epochs: 40
  batch_size: 1024
  lr: 5.0e-4
  seed: 0

  # параметры конкретных режимов (неиспользуемые в текущем режиме игнорируются):
  l1_coef: 5.0e-2        # для relu_l1
  k: 64                  # для topk
  l0_coef: 2.0e-2        # для jumprelu (баланс recon/L0; при необходимости поднять)
  # θ и ε живут в пространстве пре-активаций (норма (x−b_dec) здесь ~150,
  # проекции порядка единиц-десятков). Старые 0.1/0.1 давали почти всегда
  # пустое STE-окно |z−θ|<ε/2 → θ не обучался. См. src/sae.py::JumpReLUFunction.
  theta_init: 1.0        # для jumprelu (стартовый порог; разумно 1–3)
  ste_eps: 1.0           # для jumprelu (ширина STE-окна; разумно 0.5–2)

analysis:
  min_fires: 20          # минимум активаций нейрона во всём корпусе
  max_fire_rate: 0.5     # отсекаем BOS-подобные «всегда-активные»
  top_neurons_k: 50      # сколько брать в общую top-N выборку (отчёт по интересным)
  top_contexts_k: 15     # сколько контекстов на нейрон для отчёта
  context_window: 30     # сколько токенов до позиции активации показывать
  encode_batch_size: 4096  # для прогона активаций через encoder SAE

contrast:
  pos_label: "Yes"
  neg_label: "No"        # альтернатива для борьбы с дисбалансом: "?"
  top_k: 10              # сколько брать с каждой стороны
  pool_factor: 3         # внутри top_k берём top_k * pool_factor от каждой метрики (token / sample),
                         # потом пересекаем — это и даёт финальный top_k
  # Срез для КОНТРАСТА (выбор Yes/No-триггеров). SAE/features/stats считаем на
  # FULL, а сам контраст — на BALANCED (метки используются, шум редкого класса
  # вреден). "balanced" → строим маску по позициям full-pack без повторной
  # экстракции (src/build_datasets.balanced_sample_mask). "full" → старое
  # поведение (контраст на всех данных).
  slice: "balanced"      # balanced | full
  balanced_dir: "data/results_dilemma_v2_balanced"  # если есть — берём ровно этот срез; иначе derive
  balanced_seed: 0       # сид андерсэмплинга для fallback-derive
  # Потолок числа ПОЗИЦИЙ для контраста: плотная (P × d_hidden) float32 это
  # ~P·d_hidden·4 байт (при 51k×57k ≈ 12 ГБ на копию). 20k позиций для Cohen's d
  # статистически с запасом, а памяти на порядок меньше. null → без потолка.
  max_positions: 20000

interpret:
  judge_model: "openai/gpt-4o-mini"
  max_snippets_per_neuron: 15
  api_base: "https://openrouter.ai/api/v1"
  # OPENROUTER_API_KEY читается из переменной окружения (см. README)

# --- 06_eval_ev: held-out explained variance (leave-one-file-out) ---
eval_ev:
  held_files: null         # null → все file_idx из samples.json (обычно 1..8); или явный список
  random_split: true       # дополнительно один baseline-сплит 90/10 ПО reasoning-ответам
  random_split_frac: 0.1   # доля test для random-split
  seed: 0                  # сид раздела random-split
  epochs: null             # null → берём sae.epochs; задать меньше, чтобы ускорить 9 переобучений
  encode_batch_size: 8192  # батч для потокового расчёта EV (encode→decode)
  # SAE-гиперпараметры (mode/expansion/k/lr/...) наследуются из секции sae.

# --- 07_steering: причинная проверка триггерных нейронов ---
steering:
  # ВАЖНО: индексы нейронов SAE привязаны к КОНКРЕТНОМУ обученному SAE. После
  # переобучения старые ID (12177 и т.п.) невалидны, поэтому по умолчанию цели
  # выбираются ПРОГРАММНО из контраста текущего SAE (секция contrast).
  neuron_ids: [26266, 14551, 2336, 6750]   # [] → авто-выбор; иначе явный список int (для приложенного «родного» SAE)
  n_yes: 2                 # сколько top Yes-триггеров взять из контраста
  n_no: 2                  # сколько top No/?-триггеров взять из контраста
  add_random_control: true # добавить 1 случайный нейрон похожей частоты (контроль)
  random_fire_rate_range: [0.01, 0.10]
  random_seed: 0

  # --- Масштаб alpha (Задача 3) ---
  # Сетка alpha строится как ДОЛИ от медианы нормы ||h|| на слое -5
  # (src/steering.alpha_scale_grid). Прежние фиксированные ±2/±5 были ~3% нормы
  # → стиринг не двигался. alphas: null → авто из нормы; явный список = старое
  # поведение (оставлено опцией).
  alphas: null
  alpha_fractions: [0.5, 1.0, 2.0]   # 7 точек вместо 11
  # a → alphas = {±a·median||h||} ∪ {0}

  # --- Протокол оценки (Задача 3) ---
  n_generations: 30        # >= 30 генераций на (нейрон, alpha, промпт); разные seed
  base_seed: 1234          # seed генерации g = base_seed + g (независимость сэмплов)
  max_new_tokens: 400
  temperature: 1.0         # было 0.7 — слишком узко, сэмплы почти совпадали
  gen_batch_size: 4        # батч генерации (T4: 4)
  log_every: 10            # лог прогресса раз в N генераций

  bootstrap_n: 1000        # ресэмплов для percentile-CI доли Yes/No/?
  bootstrap_ci: 95.0       # ширина доверительного интервала, %
  bootstrap_seed: 0

  # Отбор промптов по податливости (по бейзлайну alpha=0, считается заранее):
  prompts_per_set: 3       # сколько промптов в каждый набор (push_down / push_up)
  down_yes_min: 0.55       # «толкаем к No»: кандидаты с p_yes(baseline) >= этого
  up_yes_max: 0.45         # «толкаем к Yes»: кандидаты с p_yes(baseline) <= этого
  # null → использовать ВСЕ промпты без разбиения (старое поведение)
  prompt_selection: "susceptible"   # susceptible | all

  judge_model: "openai/gpt-4o-mini"   # судья Yes/No/? (api_base берётся из interpret.api_base)
  judge_concurrency: 8     # параллельные async-запросы к OpenRouter

paths:
  artifacts_dir: "./artifacts"
  figures_dir: "./artifacts/figures"
  logs_dir: "./artifacts/logs"

# Логирование
logging:
  level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  console: true
  file: true
